<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meet Speaking Order</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h3c4 0 6 10 10 10h3M17 14l3 3-3 3M4 17h3c1.3 0 2.4-1 3.5-2.5M13.5 9.5C14.6 8 15.7 7 17 7h3M17 4l3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><span class="eyebrow">FOR GOOGLE MEET</span><h1>Speaking order</h1></div>
    </header>
    <main>
      <p class="intro">A little shuffle. A turn for everyone.</p>
      <div class="toolbar"><span id="count">Finding participants…</span><button id="refresh" class="text-button" type="button">↻ Refresh</button></div>
      <p id="status" role="status" aria-live="polite">Reading the current call…</p>
      <p id="warning" class="warning" hidden></p>
      <section class="message-card" aria-labelledby="message-label">
        <div class="card-heading"><label id="message-label" for="message">YOUR MESSAGE</label><span class="tag">Ready for chat</span></div>
        <textarea id="message" spellcheck="false" placeholder="Your randomized speaking order will appear here." aria-describedby="message-help"></textarea>
      </section>
      <p id="message-help" class="hint">Edit the message if you like, then paste it into Meet chat.</p>
      <div class="actions"><button id="shuffle" class="secondary" type="button" disabled>Shuffle again</button><button id="copy" class="primary" type="button" disabled>Copy message <span aria-hidden="true">↗</span></button></div>
      <details id="editor">
        <summary>Edit participants <span aria-hidden="true">+</span></summary>
        <label for="names">One name per line. Include yourself if you’re taking a turn.</label>
        <textarea id="names" rows="5" placeholder="Alex Chen&#10;Sam Taylor&#10;Morgan Lee"></textarea>
        <button id="apply" class="secondary" type="button">Use these names & shuffle</button>
      </details>
    </main>
    <footer><span class="privacy-dot" aria-hidden="true"></span>Names stay in this popup. Nothing is stored.</footer>
  </body>
</html>
